<!doctype html>
<html lang="bg">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Favicon & икони за начален екран (iOS използва PNG apple-touch-icon) -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Смолян Клима" />

  <!-- Theme colour (mobile browser toolbar) -->
  <meta name="theme-color" content="#FF6A00" />

  <!-- SEO -->
  <title>Смолян Клима — Климатични инсталации</title>
  <link rel="preload" as="image" href="/images/hero-back.png" fetchpriority="high" />

  <!-- Google Consent Mode v2 — defaults before any Google scripts -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      functionality_storage: 'denied',
      personalization_storage: 'denied',
      security_storage: 'granted',
      wait_for_update: 500
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/frontend/main.tsx"></script>
</body>

</html>
